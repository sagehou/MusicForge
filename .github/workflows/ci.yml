name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: musicforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
      rollback_required: ${{ steps.ui.outputs.rollback_required || steps.plan.outputs.rollback_required }}
      validation_run: ${{ steps.plan.outputs.reuse_run || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: CI scope and rollback policy regression checks
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Plan acceptance and check documentation
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check-ci-scope.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.plan.outputs.scope != 'docs' && steps.plan.outputs.reuse_run == ''
        with:
          node-version-file: .node-version
      - name: Frontend locked dependencies
        if: steps.plan.outputs.scope != 'docs' && steps.plan.outputs.reuse_run == ''
        working-directory: web
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts; fi
          npm ci --no-audit --no-fund
      - name: Check the presentation classifier
        if: steps.plan.outputs.scope != 'docs' && steps.plan.outputs.reuse_run == ''
        run: node --test .github/scripts/test_ui_scope.mjs
      - name: Verify TSX changes preserve executable syntax
        id: ui
        if: steps.plan.outputs.scope == 'ui' && steps.plan.outputs.reuse_run == ''
        run: node .github/scripts/check-ui-scope.mjs
      - name: Final acceptance scope
        id: scope
        env:
          SCOPE: ${{ steps.ui.outputs.scope || steps.plan.outputs.scope }}
        run: |
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "Final application acceptance: **$SCOPE**." >> "$GITHUB_STEP_SUMMARY"
      - name: Frontend typecheck and build
        if: steps.scope.outputs.scope != 'docs' && steps.plan.outputs.reuse_run == ''
        working-directory: web
        run: npm run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.scope == 'full' && steps.plan.outputs.reuse_run == ''
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.scope.outputs.scope == 'full' && steps.plan.outputs.reuse_run == ''
      - name: Build pinned stable media tools in CI
        if: steps.scope.outputs.scope == 'full' && steps.plan.outputs.reuse_run == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: media
          outputs: type=local,dest=.ci/media
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          pull: true
      - name: Use the release media tools for all executable validation
        if: steps.scope.outputs.scope == 'full' && steps.plan.outputs.reuse_run == ''
        run: echo "$PWD/.ci/media/bin" >> "$GITHUB_PATH"
      - name: Generate initial source lockfiles in CI
        if: steps.scope.outputs.scope == 'full' && steps.plan.outputs.reuse_run == ''
        run: |
          if [ ! -f web/package-lock.json ]; then
            (cd web && npm install --package-lock-only --ignore-scripts)
          fi
          if [ ! -f go.sum ]; then
            go mod tidy
          fi
          gofmt -w cmd internal web/embed.go
          if git ls-files --error-unmatch go.sum >/dev/null 2>&1; then
            git diff --exit-code -- go.mod go.sum web/package-lock.json
          fi
      - name: Start the real Navidrome integration service
        if: steps.scope.outputs.scope == 'full' && steps.plan.outputs.reuse_run == ''
        run: |
          mkdir -p .ci/nav-output
          chmod 755 .ci/nav-output
          docker run -d --name musicforge-nav-validation -p 127.0.0.1:4533:4533 \
            -e ND_PORT=4533 -e ND_SCANSCHEDULE=0 -e ND_ENABLEEXTERNALSERVICES=false \
            -e ND_DEVAUTOCREATEADMINPASSWORD=ci-only-musicforge-password \
            -v "$PWD/.ci/nav-output:/music:ro" deluan/navidrome:0.64.2
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4533/ping; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Backend race, integration tests and vet
        if: steps.scope.outputs.scope == 'full' && steps.plan.outputs.reuse_run == ''
        env:
          MUSICFORGE_TEST_NAV_URL: http://127.0.0.1:4533
          MUSICFORGE_TEST_NAV_OUTPUT: ${{ github.workspace }}/.ci/nav-output
        run: |
          go test -mod=readonly -race -count=1 -timeout=5m ./...
          go vet -mod=readonly ./...
          go build -mod=readonly -trimpath -o .ci/musicforge ./cmd/musicforge
      - name: Real rclone mount, stalled reads and responsive queue controls
        if: steps.scope.outputs.scope == 'full' && steps.plan.outputs.reuse_run == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rclone fuse3
          python3 .github/scripts/check-rclone.py
      - name: Rclone acceptance evidence
        if: always() && steps.scope.outputs.scope == 'full' && steps.plan.outputs.reuse_run == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rclone-acceptance
          path: |
            .ci/rclone/evidence.json
            .ci/rclone/*.log
          retention-days: 14
      - name: Browser validation against the actual application
        if: steps.scope.outputs.scope == 'full' && steps.plan.outputs.reuse_run == ''
        run: |
          mkdir -p .ci/config .ci/source/Artist/Album .ci/output
          ffmpeg -v error -f lavfi -i sine=frequency=440:duration=2 -c:a flac -metadata artist='CI Artist' -metadata album='CI Album' -metadata title='CI Track' .ci/source/Artist/Album/01.flac
          # Generate PNGs without filters omitted from the pinned release FFmpeg.
          python3 .github/scripts/browser-artwork.py
          touch -d '2 minutes ago' .ci/source/Artist/Album/01.flac
          chmod +x .github/scripts/browser-ffmpeg.py
          MUSICFORGE_CONFIG_DIR="$PWD/.ci/config" MUSICFORGE_FFMPEG="$PWD/.github/scripts/browser-ffmpeg.py" MUSICFORGE_PUBLIC_URL=http://127.0.0.1:8787 MUSICFORGE_ALLOWED_ORIGINS=http://localhost:8787 .ci/musicforge >.ci/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd web
          npx playwright install --with-deps chromium
          MUSICFORGE_TEST_ROOT="$(dirname "$PWD")/.ci" npm test
      - name: UI browser checks against the built frontend
        if: steps.scope.outputs.scope == 'ui' && steps.plan.outputs.reuse_run == ''
        run: |
          python3 .github/scripts/browser-artwork.py
          cd web
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 8787 --strictPort >../.ci/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/library >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/library >/dev/null
          # The selected existing cases mock their API; no backend or audio is needed.
          npm test -- language.spec.ts --grep 'translation catalogs' --reporter=list
          mapfile -t ui_specs < ../.ci/ui-specs.txt
          MUSICFORGE_TEST_ROOT="$(dirname "$PWD")/.ci" npm test -- "${ui_specs[@]}"
      - name: Stop the Navidrome validation service
        if: always() && steps.scope.outputs.scope == 'full' && steps.plan.outputs.reuse_run == ''
        run: docker rm -f musicforge-nav-validation || true
      - name: CI-generated source snapshot
        if: always() && steps.scope.outputs.scope == 'full' && steps.plan.outputs.reuse_run == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-source
          path: |
            go.mod
            go.sum
            cmd/**/*.go
            internal/**/*.go
            web/embed.go
            web/package-lock.json
          retention-days: 14
      - name: Browser reports
        if: always() && steps.scope.outputs.scope != 'docs' && steps.plan.outputs.reuse_run == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          path: |
            web/test-results
            web/playwright-report
          retention-days: 14
      - name: Record successful application validation
        if: steps.plan.outputs.reuse_run == ''
        env:
          VALIDATED_SCOPE: ${{ steps.scope.outputs.scope }}
        run: python3 .github/scripts/check-ci-scope.py --record
      - name: Successful validation evidence
        if: steps.plan.outputs.reuse_run == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-evidence
          path: .ci/validation-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Acceptance plan and rollback evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rollback-scope
          path: |
            .ci/rollback-scope.json
            .ci/ci-scope.json
            .ci/ui-specs.txt
          retention-days: 14
      - name: Worker diagnostics
        if: failure()
        run: |
          if [ -f .ci/server.log ]; then
            sed '/"setup_code"/d' .ci/server.log
          fi

  audit:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || (needs.validate.outputs.scope != 'docs' && needs.validate.outputs.reuse_run == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate.outputs.scope == 'full'
        with:
          name: canonical-source
          path: .
          run-id: ${{ needs.validate.outputs.validation_run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Audit locked dependencies without reinstalling
        working-directory: web
        run: npm audit --audit-level=high --fetch-timeout=30000 --fetch-retries=2

  image:
    needs: [validate, audit]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.audit.result == 'success' || needs.audit.result == 'skipped') && ((needs.validate.outputs.scope == 'full' && needs.validate.outputs.reuse_run == '') || startsWith(github.ref, 'refs/tags/v')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate.outputs.scope == 'full'
        with:
          name: canonical-source
          path: .
          run-id: ${{ needs.validate.outputs.validation_run }}
          github-token: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native architecture image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          pull: true
          tags: musicforge:validation
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Container smoke test
        run: |
          docker run -d --name musicforge-validation -p 8787:8787 musicforge:validation
          for i in $(seq 1 30); do
            if docker exec musicforge-validation musicforge -healthcheck; then break; fi
            sleep 1
          done
          docker exec musicforge-validation musicforge -healthcheck
          docker exec musicforge-validation ffmpeg -v error -f lavfi -i sine=duration=1 -c:a libopus -b:a 192k /tmp/smoke.opus
          docker exec musicforge-validation ffmpeg -v error -f lavfi -i sine=duration=1 -c:a libmp3lame -q:a 2 /tmp/smoke.mp3
          docker exec musicforge-validation ffprobe -v error -show_entries stream=codec_name /tmp/smoke.opus
          docker exec musicforge-validation ffprobe -v error -show_entries stream=codec_name /tmp/smoke.mp3
          docker exec musicforge-validation ffmpeg -v error -f lavfi -i sine=duration=1 -c:a flac /tmp/smoke.flac
          docker exec musicforge-validation flac --test --silent /tmp/smoke.flac
          docker exec musicforge-validation sh -c 'flac --decode --stdout --silent /tmp/smoke.flac | ffmpeg -v error -xerror -f wav -i pipe:0 -c:a libopus /tmp/reference.opus'
          docker exec musicforge-validation sh -c 'flac --decode --stdout --silent --decode-through-errors --force-raw-format --endian=little --sign=signed --until=44100 /tmp/smoke.flac | ffmpeg -v error -xerror -f s16le -ar 44100 -ac 1 -i pipe:0 -c:a libopus /tmp/reference-raw.opus'
          docker exec musicforge-validation ffmpeg -v error -f lavfi -i sine=duration=1 -c:a flac -sample_fmt s32 /tmp/smoke24.flac
          docker exec musicforge-validation sh -c 'flac --decode --stdout --silent --decode-through-errors --force-raw-format --endian=little --sign=signed --until=44100 /tmp/smoke24.flac | ffmpeg -v error -xerror -f s24le -ar 44100 -ac 1 -i pipe:0 -c:a libmp3lame /tmp/reference-raw24.mp3'
          docker exec musicforge-validation test -f /usr/share/doc/musicforge/media/media-versions.env
          curl --fail http://localhost:8787/api/auth/me
          docker stop musicforge-validation
      - name: Compose deployment with host mounts and custom UID
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          export MUSICFORGE_VERSION="ci-$ARCH"
          export CONFIG_DIR="$PWD/.ci/compose-config"
          export FLAC_DIR="$PWD/.ci/compose-source"
          export OUTPUT_DIR="$PWD/.ci/compose-output"
          export MUSICFORGE_PUBLIC_URL=http://localhost:8787
          export PUID=12001 PGID=12001
          docker tag musicforge:validation "ghcr.io/${GITHUB_REPOSITORY,,}:$MUSICFORGE_VERSION"
          mkdir -p "$CONFIG_DIR" "$FLAC_DIR" "$OUTPUT_DIR"
          sudo chown 12001:12001 "$CONFIG_DIR" "$OUTPUT_DIR"
          # Writable host permissions ensure the read-only mount itself is tested.
          chmod 777 "$FLAC_DIR"
          docker compose config --quiet
          trap 'docker compose down' EXIT
          if FLAC_DIR="$PWD/.ci/missing-source" docker compose up -d --no-build --pull never; then
            echo 'Compose incorrectly accepted a missing source mount'
            exit 1
          fi
          test ! -e "$PWD/.ci/missing-source"
          docker compose up -d --no-build --pull never
          for i in $(seq 1 30); do
            if docker compose exec -T musicforge musicforge -healthcheck; then break; fi
            sleep 1
          done
          docker compose exec -T musicforge musicforge -healthcheck
          docker compose exec -T musicforge sh -c 'test "$(id -u)" = 12001 && test "$(stat -c %a /config)" = 700 && test -w /music/output && test ! -w /music/source'
          docker compose exec -T musicforge sh -c 'if touch /music/source/should-not-exist; then exit 1; fi'
          test ! -e "$FLAC_DIR/should-not-exist"
          # Exercise the optional credential mount with a synthetic value only.
          export NETEASE_SECRETS_DIR="$PWD/.ci/compose-secrets"
          mkdir -p "$NETEASE_SECRETS_DIR"
          printf 'MUSIC_U=ci-only-fake-cookie\n' > "$NETEASE_SECRETS_DIR/netease.cookie"
          chmod 700 "$NETEASE_SECRETS_DIR"
          chmod 600 "$NETEASE_SECRETS_DIR/netease.cookie"
          sudo chown -R 12001:12001 "$NETEASE_SECRETS_DIR"
          docker compose -f docker-compose.yml -f docker-compose.netease.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.netease.yml up -d --no-build --pull never
          for i in $(seq 1 30); do
            if docker compose exec -T musicforge musicforge -healthcheck; then break; fi
            sleep 1
          done
          docker compose exec -T musicforge musicforge -healthcheck
          docker compose exec -T musicforge sh -c 'test "$MUSICFORGE_NETEASE_COOKIE_FILE" = /run/secrets/musicforge/netease.cookie && test -r "$MUSICFORGE_NETEASE_COOKIE_FILE" && test ! -w "$MUSICFORGE_NETEASE_COOKIE_FILE"'
      - name: Same-schema rollback with published releases
        if: needs.validate.outputs.rollback_required != 'false'
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 .github/scripts/check-rollback.py
      - name: Rollback evidence
        if: needs.validate.outputs.rollback_required != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rollback-${{ matrix.arch }}
          path: .ci/rollback-evidence.json
          retention-days: 14
      - name: Push validated architecture on version tags
        if: startsWith(github.ref, 'refs/tags/v') && needs.audit.result == 'success'
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag musicforge:validation "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION-$ARCH"
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION-$ARCH"

  ci:
    if: always()
    needs: [validate, audit, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all selected checks
        env:
          VALIDATE: ${{ needs.validate.result }}
          AUDIT: ${{ needs.audit.result }}
          IMAGE: ${{ needs.image.result }}
          SCOPE: ${{ needs.validate.outputs.scope }}
          REUSED: ${{ needs.validate.outputs.reuse_run }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          test "$VALIDATE" = success
          if [[ "$RELEASE" == true || "$SCOPE" != docs && -z "$REUSED" ]]; then
            test "$AUDIT" = success
          else
            test "$AUDIT" = skipped
          fi
          if [[ "$SCOPE" == full && -z "$REUSED" || "$RELEASE" == true ]]; then
            test "$IMAGE" = success
          else
            test "$IMAGE" = skipped
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multiarchitecture version and stable latest
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "$image:$VERSION")
          if [[ "$VERSION" != *-* ]]; then tags+=(--tag "$image:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          docker buildx imagetools inspect "$image:$VERSION"
