name: Lyrics provider online check

on:
  push:
    branches: [codex/lrc-lyrics-provider-check]

permissions:
  contents: read

jobs:
  online:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Search and preview English, Chinese and Japanese recordings
        run: go test -mod=readonly -count=1 -v -timeout=6m -run '^(TestLyricsProvidersOnline|TestLyricsProviderPriorityAndFallback|TestNetEase.*)$' ./internal/forge
