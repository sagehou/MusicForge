<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MusicForge · Flat Studio 设计预览</title>
<style>
:root { color-scheme: dark; --canvas:#111214; --surface:#17181b; --subtle:#202125; --hover:#292b30; --ink:#f5f5f7; --muted:#9e9ea8; --line:#2b2d33; --accent:#f06f81; --fill:#e6213c; --accent-soft:#332027; --success:#86efac; --warning:#e8c279; --danger:#fca5a5; --mono:"SFMono-Regular",Consolas,monospace; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--canvas); }
:root[data-theme="light"] { color-scheme:light; --canvas:#fbfbfc; --surface:#fff; --subtle:#f1f2f4; --hover:#e9ebef; --ink:#18191d; --muted:#646874; --line:#e5e6ea; --accent:#cf1e36; --accent-soft:#faedf0; --success:#15803d; --warning:#b45309; --danger:#b91c1c; }
* { box-sizing:border-box; }
body { margin:0; font-size:13px; line-height:1.6; }
h1,h2,h3,p { margin:0; }
h1 { font-size:18px; font-weight:600; }
h2 { font-size:15px; font-weight:600; }
h3 { font-size:13px; font-weight:600; }
small,.muted { color:var(--muted); }
small { font-size:12px; }
button,input,select { font:inherit; }
button,select { cursor:pointer; }
button { border:1px solid transparent; border-radius:6px; background:transparent; color:inherit; padding:5px 10px; min-height:32px; }
button:hover { background:var(--hover); }
button:disabled { cursor:default; opacity:.45; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
svg.icon { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.primary { background:var(--fill); color:#fff; }
.primary:hover { background:#cf1e36; }
.outline { border-color:var(--line); }
.icon-button { display:inline-grid; place-items:center; width:32px; padding:5px; }
.inline,.actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.actions { justify-content:flex-end; }
.mono { font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; }
.status { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--success); }
.status::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
.warning { color:var(--warning); }
.danger { color:var(--danger); }
#inspector-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--surface); }
.inspector-title { font-weight:600; }
.inspector-note { display:block; font-weight:400; }
#inspector-bar label { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
select,input:not([type="checkbox"],[type="range"]) { min-width:0; padding:6px 10px; min-height:32px; border:1px solid var(--line); border-radius:6px; color:var(--ink); background:var(--surface); }
input[type="checkbox"],input[type="range"] { accent-color:var(--fill); }
#preview-container { display:flex; justify-content:center; padding:20px; }
#preview-frame { width:1440px; max-width:100%; height:900px; border:1px solid var(--line); container:workspace / inline-size; overflow:hidden; }
#preview-frame[data-vp="tablet"] { width:768px; }
#preview-frame[data-vp="mobile"] { width:390px; height:844px; }
.app { display:grid; grid-template-columns:236px minmax(0,1fr); height:100%; }
.sidebar { display:flex; flex-direction:column; min-height:0; padding:20px 14px; border-right:1px solid var(--line); background:var(--surface); }
.brand { display:flex; align-items:center; gap:10px; padding:4px 8px 20px; border-bottom:1px solid var(--line); }
.brand-icon { display:grid; place-items:center; width:30px; height:30px; border-radius:6px; background:var(--fill); color:#fff; flex:none; }
.brand-wordmark { font-size:14px; font-weight:600; }
.brand-wordmark small { display:block; font:11px var(--mono); margin-top:2px; }
.sidebar-navigation { flex:1; min-height:0; overflow-y:auto; padding-top:14px; scrollbar-width:thin; }
.nav-link { display:flex; align-items:center; gap:10px; text-align:left; width:100%; min-height:36px; padding:7px 11px; color:var(--muted); margin-bottom:3px; }
.nav-link.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.nav-group { margin-top:20px; }
.group-title { margin:0 11px 6px; font-size:11px; color:var(--muted); }
.nav-group .nav-link { font-size:12px; min-height:34px; }
.nav-group .icon { width:16px; height:16px; }
.sidebar-bottom { display:flex; align-items:center; gap:8px; border-top:1px solid var(--line); padding:14px 4px 0; margin-top:12px; }
.avatar { display:grid; place-items:center; width:26px; height:26px; border:1px solid var(--line); border-radius:6px; background:var(--subtle); font-size:11px; }
.account-name small { display:block; font-size:11px; }
.main { display:flex; flex-direction:column; min-width:0; min-height:0; }
.page-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:82px; padding:16px 28px; border-bottom:1px solid var(--line); }
.heading-copy { min-width:0; }
.heading-copy p { color:var(--muted); font-size:12px; }
.page-body { flex:1; min-height:0; overflow-y:auto; padding:24px 28px 40px; }
.bottom-navigation { display:none; }
.toolbar { padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:14px; }
.segmented { display:inline-flex; background:var(--subtle); padding:3px; border-radius:6px; gap:2px; }
.segmented button { min-height:28px; font-size:12px; padding:3px 12px; color:var(--muted); }
.segmented button.selected { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.search { width:100%; margin-top:12px; }
.maintenance { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; color:var(--muted); font-size:12px; margin-bottom:14px; }
.track-head,.track-row { display:grid; grid-template-columns:22px minmax(0,1fr) 58px 180px 100px 78px 130px; gap:10px; align-items:center; }
.track-head { color:var(--muted); font-size:12px; padding:8px; border-bottom:1px solid var(--line); }
.track-row { padding:12px 8px; border-bottom:1px solid var(--line); }
.track-row > * { min-width:0; overflow-wrap:anywhere; }
.track-title { display:flex; align-items:center; gap:8px; }
.track-title strong { font-size:13px; font-weight:500; }
.track-title .icon-button { flex:none; }
.track-name small { display:block; margin-top:3px; }
.track-facts { display:grid; grid-column:3 / 6; grid-template-columns:58px minmax(0,1fr) 100px; gap:10px; min-width:0; }
.track-facts > span { min-width:0; }
.track-spec,.track-sizes { font:12px/1.8 var(--mono); }
.track-spec > span,.track-sizes > span { display:block; }
.mobile-label { display:none; }
.track-lyrics { font-size:12px; }
.track-lyrics .actions { justify-content:flex-start; gap:4px; margin-top:4px; }
.track-lyrics button { min-height:24px; padding:2px 5px; }
.audition-panel { margin:0 8px 12px; padding:12px 16px 18px; background:transparent; }
.audition-header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:8px; }
.audition-header > div { display:flex; align-items:baseline; flex-wrap:wrap; gap:2px 12px; }
.audition-header h3 { font-size:11px; font-weight:500; color:var(--muted); }
.audition-header small { color:var(--ink); font-size:13px; }
.audition-body { display:grid; grid-template-columns:minmax(240px,.9fr) minmax(280px,1.1fr); gap:24px; align-items:start; }
.audition-controls { display:flex; align-items:center; gap:10px; padding-top:4px; }
.audition-controls input { flex:1; min-width:0; height:32px; padding:0; appearance:none; background:transparent; }
.audition-controls input::-webkit-slider-runnable-track { height:3px; border-radius:3px; background:var(--line); }
.audition-controls input::-webkit-slider-thumb { appearance:none; width:12px; height:12px; margin-top:-4.5px; border-radius:50%; background:var(--accent); }
.audition-controls input::-moz-range-track { height:3px; background:var(--line); }
.audition-controls input::-moz-range-thumb { width:12px; height:12px; border:0; border-radius:50%; background:var(--accent); }
.play-button { flex:none; width:40px; height:40px; min-height:40px; border-radius:50%; padding:8px; display:grid; place-items:center; }
.audition-transcript { min-width:0; border-inline-start:1px solid var(--line); padding-inline-start:24px; }
.lyrics-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 4px; font-size:12px; color:var(--muted); }
.lyrics-heading small { margin-left:8px; font-size:11px; }
.follow { color:var(--accent); background:var(--accent-soft); }
.lyrics-scroll { max-height:192px; overflow-y:auto; border:1px solid transparent; }
.lyric-line { display:flex; align-items:baseline; gap:12px; min-height:40px; padding:8px 10px; border-radius:4px; color:var(--muted); }
.lyric-line time { font:11px var(--mono); }
.lyric-line.current { color:var(--accent); background:var(--accent-soft); font-weight:500; }
.metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); padding-bottom:16px; border-bottom:1px solid var(--line); margin-bottom:20px; }
.metric { padding:16px 18px; border-inline-end:1px solid var(--line); }
.metric:last-child { border:0; }
.metric strong { display:block; font:600 26px/1.4 var(--mono); margin-block:6px; }
.readiness { padding-block:18px; border-bottom:1px solid var(--line); margin-bottom:20px; }
.meter { height:6px; border-radius:6px; background:var(--subtle); margin-top:12px; overflow:hidden; }
.meter span { display:block; height:100%; background:var(--fill); }
.workspace { display:grid; grid-template-columns:2fr minmax(220px,1fr); gap:24px; }
.section-title { padding-block:12px; border-bottom:1px solid var(--line); color:var(--muted); }
.job-row { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
.job-row > div { flex:1; min-width:0; }
.job-row small { display:block; }
.side-section { padding-block:18px; border-bottom:1px solid var(--line); }
.side-section strong { display:block; font:600 22px var(--mono); margin-block:10px; }
.side-section code { font:11px var(--mono); overflow-wrap:anywhere; }
.comparison-metrics { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:12px; padding-block:20px; border-block:1px solid var(--line); margin-block:16px; }
.comparison-metrics strong { display:block; font:600 20px var(--mono); margin-top:8px; }
.difference { display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:10px; padding-block:14px; border-bottom:1px solid var(--line); }
.difference code { overflow-wrap:anywhere; font:12px var(--mono); }
.picker { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; }
.candidate { display:flex; align-items:flex-start; gap:10px; padding:12px 10px; border-bottom:1px solid var(--line); border-inline-start:2px solid transparent; }
.candidate.selected { border-inline-start-color:var(--accent); background:var(--accent-soft); }
.candidate > div { min-width:0; }
.candidate small { display:block; margin-top:4px; }
.preview-pane { display:flex; flex-direction:column; min-width:0; gap:12px; }
.lyric-preview { flex:1; min-height:120px; margin:0; padding:8px 0; white-space:pre-wrap; font:13px/2 var(--mono); color:var(--ink); }
.save-actions { padding-top:12px; border-top:1px solid var(--line); }
.save-actions small { display:block; margin-bottom:10px; }
.settings-layout { display:grid; grid-template-columns:180px minmax(0,1fr); gap:24px; }
.settings-tabs button { display:block; width:100%; text-align:left; color:var(--muted); margin-bottom:3px; }
.settings-tabs button.selected { color:var(--ink); background:var(--subtle); }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-block:20px; }
.field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.field small { font-size:11px; }
.settings-save { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding-top:14px; border-top:1px solid var(--line); }
@container workspace (max-width:1100px) {
  .track-head { display:none; }
  .track-row { grid-template-columns:22px minmax(0,.8fr) minmax(0,1.2fr); gap:8px; padding:14px 0; }
  .track-row > input { grid-column:1; grid-row:1; align-self:start; margin-top:8px; }
  .track-name { grid-column:2 / -1; grid-row:1; }
  .track-facts { display:flex; flex-wrap:wrap; grid-column:1 / -1; grid-row:2; gap:3px 14px; font-size:11.5px; }
  .track-spec { order:-1; flex-basis:100%; display:flex; align-items:baseline; flex-wrap:wrap; gap:2px 10px; }
  .track-spec,.track-sizes { font-size:11.5px; }
  .track-spec > span,.track-sizes > span { display:inline; }
  .track-sizes { display:flex; flex-wrap:wrap; gap:4px 12px; }
  .mobile-label { display:inline; font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--muted); margin-inline-end:4px; }
  .track-row > .status { grid-column:1 / 3; grid-row:3; }
  .track-lyrics { display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:4px 8px; grid-column:3; grid-row:3; }
  .track-lyrics > span { flex:1 1 auto; text-align:end; }
  .track-lyrics .actions { margin:0; flex-wrap:nowrap; }
  .track-lyrics button { min-width:32px; min-height:32px; }
  .audition-body { grid-template-columns:minmax(0,1fr); gap:12px; }
  .audition-transcript { border-inline-start:0; padding:8px 0 0; border-top:1px solid var(--line); }
  .comparison-metrics { grid-template-columns:repeat(4,minmax(0,1fr)); }
}
@container workspace (max-width:800px) { .app { grid-template-columns:72px minmax(0,1fr); } .sidebar { padding-inline:10px; } .brand { justify-content:center; padding-inline:0; } .brand-wordmark,.nav-label,.group-title,.account-name { display:none; } .nav-link { justify-content:center; padding-inline:8px; } .sidebar-bottom { justify-content:center; } .workspace,.picker,.settings-layout { grid-template-columns:1fr; } .settings-tabs { display:flex; flex-wrap:wrap; gap:4px; } .settings-tabs button { width:auto; } .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); } .metric:nth-child(n) { border:0; border-bottom:1px solid var(--line); } }
@container workspace (max-width:600px) { .app { display:flex; flex-direction:column; } .sidebar { display:none; } .main { flex:1; } .page-heading { min-height:74px; padding:14px; gap:8px; } .heading-copy p { font-size:11px; } .page-heading > .actions { flex-wrap:nowrap; } .page-heading .icon-button { display:none; } .page-body { padding:14px 14px 24px; } .bottom-navigation { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); flex:none; padding:4px 8px; border-top:1px solid var(--line); background:var(--surface); } .bottom-navigation button { display:flex; flex-direction:column; align-items:center; font-size:11px; gap:3px; padding:5px; color:var(--muted); } .bottom-navigation .active { color:var(--accent); } .comparison-metrics { grid-template-columns:repeat(2,minmax(0,1fr)); } .metric { padding:12px; } .metric strong { font-size:24px; } .toolbar > .inline { display:grid; grid-template-columns:minmax(0,1fr) 32px; gap:8px; } .segmented { display:flex; min-width:0; } .segmented button { display:flex; flex-direction:column; flex:1; min-width:0; padding:4px; white-space:nowrap; line-height:17px; } .segmented .count { font-size:11px; font-variant-numeric:tabular-nums; } .track-title strong { font-size:14px; font-weight:600; } .track-title .icon-button { width:36px; height:36px; border:1px solid var(--line); border-radius:50%; } .audition-panel { margin-inline:0; padding:10px 0 14px; } .audition-controls { gap:8px; } .lyrics-heading small { display:none; } .form-grid { grid-template-columns:1fr; } }
@media (max-width:600px) { #preview-container { padding:0; } #preview-frame { border-inline:0; } #inspector-bar { padding:12px; } .inspector-title { font-size:12px; } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12c2.5 0 2.5-4 5-4s2.5 4 5 4 2.5-4 5-4 2.5 4 5 4"/></symbol>
<symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
<symbol id="i-library" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M7 12a5 5 0 0 1 5-5"/></symbol>
<symbol id="i-jobs" viewBox="0 0 24 24"><path d="M2 12h4l3-8 5 16 3-8h5"/></symbol>

<header id="inspector-bar">
<div class="inspector-title">MusicForge · Flat Studio<small class="inspector-note">设计预览 · 示例数据；业务按钮不执行任务</small></div>
<div class="inline">
<label>页面<select id="screen"><option value="library">曲目与试听</option><option value="overview">概览</option><option value="lyrics">歌词选择</option><option value="compare">文件核对</option><option value="jobs">任务</option><option value="settings">设置</option></select></label>
<label>主题<select id="theme"><option value="dark">深色</option><option value="light">浅色</option></select></label>
<label>视口<select id="viewport"><option value="desktop">桌面 1440</option><option value="tablet">平板 768</option><option value="mobile">手机 390</option></select></label>
</div>

<aside class="sidebar">
<div class="brand"><span class="brand-icon"><svg class="icon"><use href="#i-wave"/></svg></span><span class="brand-wordmark">MusicForge<small>设计预览</small></span></div>
<div class="sidebar-navigation" id="sidebar-navigation"></div>
<div class="sidebar-bottom"><span class="avatar">A</span><div class="account-name">admin<small>账户设置</small></div></div>
</aside>
<div class="main"><header class="page-heading"><div class="heading-copy"><h1 id="page-title"></h1><p id="page-description"></p></div><div class="actions" id="page-actions"></div></header><div class="page-body" id="page-body"></div></div>
<nav class="bottom-navigation" aria-label="主导航" id="bottom-navigation"></nav>
</div></div></main>
<script>
const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const button = (label, symbol, cls = '') => `<button type="button" class="${cls}">${symbol ? icon(symbol) : ''}${label}</button>`;
const mainNav = [['overview','概览','overview'],['library','音乐库','library'],['jobs','任务','jobs'],['settings','设置','settings']];
const groups = [['浏览',[['library','专辑','library'],['library','全部歌曲','tracks'],['library','全部歌手','artists']]],['管理',[['lyrics','待确认歌词','lyrics'],['settings','歌词设置','lyrics'],['settings','编码配置','wave'],['settings','集成','refresh']]]];
const row = (title, number, lyrics = '尚未检查', review = false) => `<div class="track-row"><input type="checkbox" aria-label="选择 ${title}"><div class="track-name"><div class="track-title"><strong>${number}. ${title}</strong><button class="icon-button" aria-label="试听 ${title}">${icon('play')}</button></div><small>River Ensemble · Night Studies</small></div><div class="track-facts"><span class="mono track-duration"><span class="mobile-label">时长</span>3:21</span><span class="track-spec" title="源规格与码率"><span>FLAC · 24 bit / 96 kHz · 2 声道</span><span class="muted">894 kbps</span></span><span class="track-sizes"><span><span class="mobile-label">源</span>25 MiB</span><span class="muted"><span class="mobile-label">产物</span>5 MiB</span></span></div><span class="status">已就绪</span><div class="track-lyrics"><span class="${review ? 'warning' : 'muted'}">${lyrics}</span><div class="actions"><button aria-label="重新搜索歌词">${icon('search')}</button><button aria-label="选择歌词">${icon('lyrics')}</button></div></div></div>`;

function setPage(name) {
 const screen=screens[name];
 document.getElementById('screen').value=name;
 document.getElementById('page-title').textContent=screen.title;
 document.getElementById('page-description').textContent=screen.description;
 document.getElementById('page-actions').innerHTML=(screen.action ? button(screen.action,'refresh','primary inline') : '')+button('','settings','icon-button outline');
 document.getElementById('page-actions').querySelector('.icon-button').setAttribute('aria-label','外观设置');
 document.getElementById('page-body').innerHTML=screen.content;
 const active=['lyrics','compare'].includes(name) ? 'library' : name;
 document.getElementById('sidebar-navigation').innerHTML=mainNav.map(([key,label,symbol]) => `<button class="nav-link ${key===active ? 'active' : ''}" data-screen="${key}" title="${label}">${icon(symbol)}<span class="nav-label">${label}</span></button>`).join('')+groups.map(([title,items]) => `<div class="nav-group"><p class="group-title">${title}</p>${items.map(([key,label,symbol]) => `<button class="nav-link" data-screen="${key}" title="${label}">${icon(symbol)}<span class="nav-label">${label}</span></button>`).join('')}</div>`).join('');
 document.getElementById('bottom-navigation').innerHTML=mainNav.map(([key,label,symbol]) => `<button class="${key===active ? 'active' : ''}" data-screen="${key}">${icon(symbol)}${label}</button>`).join('');
 document.querySelectorAll('[data-screen]').forEach(node=>node.addEventListener('click',()=>setPage(node.dataset.screen)));
 document.getElementById('page-body').scrollTop=0;
}
function setTheme(theme) { document.documentElement.dataset.theme=theme; document.getElementById('theme').value=theme; }
